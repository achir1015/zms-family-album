name: ZMSFamilyAlbum
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "900"
targets:
  ZMSFamilyAlbum:
    type: application
    platform: iOS
    sources:
      - path: ZMSFamilyAlbum
      - path: web            # 和線上版同一份網頁（sync.sh 從 ../docs 複製進來），整個資料夾放進 App → 離線也能用
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.zmsfamilyalbum
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ZMSFamilyAlbum/Info.plist
      properties:
        CFBundleDisplayName: 資料助秘家庭相簿編輯
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: 從照片選取要放進相簿影片的相片與影片
        NSPhotoLibraryAddUsageDescription: 把做好的相簿影片存到照片
        NSCameraUsageDescription: 拍照或錄影加入相簿
        NSMicrophoneUsageDescription: 錄製相簿影片的旁白
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  ZMSFamilyAlbum:
    build:
      targets:
        ZMSFamilyAlbum: all
    run:
      config: Debug
    archive:
      config: Release
